# 区域位于 regions.yml；首次运行自动导入旧 config.yml 的 Regions 节点。
# 玩家首次进入历史和提示偏好位于 players.yml。
Settings:
  pluginPrefix: "&7[&aRegionInfoRe&7]"
  tool: GOLDEN_HOE
  # 仅控制新玩家默认提示；不影响权限、交互限制和区域指令。
  activeOnPlayerJoin:
    biome: true
    region: true
  enforceEntryPermissions: true
  biomeHighAccuracy: true
  # tick（20 tick 约 1 秒）。区域权限检查始终随实际移动实时执行。
  biomeSpeed: 100
  # 对坐骑等路径的位置校准周期；各玩家错开到期 tick，最大校准间隔为此值。
  # 静止玩家跳过几何查询；不改变普通移动的即时权限检查。
  regionSpeed: 20
  # 兼容旧拼写 defaultRedius；新配置使用 defaultRadius。
  defaultRadius: 10
  defaultHeight: 10
  deniedMessageCooldown: 40
  index:
    # 超过此区块数量的区域仅保存在世界级候选列表，限制索引内存。
    maxChunksPerRegion: 4096
  preview:
    maxParticles: 240
Tips:
  Single:
    noPermission: "你没有权限"
    noRegion: "野外"
  Entry:
    biomeInfos:
      - "[ACB]-&b%oldBiome% &a→ &b%newBiome%"
    kickInfos:
      - "[MSG]-&c你没有权限进入 %name%"
